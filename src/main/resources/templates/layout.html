<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gia Phả - Lưu giữ & Kết nối dòng họ Việt Nam">
    <title layout:title-pattern="$CONTENT_TITLE - $LAYOUT_TITLE">Gia Phả</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Serif:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    
    <!-- Extra Head -->
    <th:block layout:fragment="extra-head"></th:block>
</head>
<body data-theme="dark">
    <header class="app-header">
        <div class="header-container">
            <a th:href="@{/}" class="logo">
                <span class="logo-icon">🌳</span>
                <span class="logo-text">Gia Phả</span>
            </a>
            
            <nav class="main-nav" id="mainNav">
                <a th:href="@{/trees}">Quản lý Gia phả</a>
            </nav>
            
            <div class="user-area">
                <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Menu">
                    <span class="hamburger"></span>
                </button>
            </div>
        </div>
    </header>

    <main class="main-content" layout:fragment="content">
        <!-- Content will be injected here -->
    </main>



    <!-- Toast Notifications -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Base Scripts -->
    <script th:src="@{/js/app.js}"></script>
    
    <!-- Extra Scripts -->
    <th:block layout:fragment="extra-scripts"></th:block>
</body>
</html>
